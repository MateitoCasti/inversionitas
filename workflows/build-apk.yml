name: Compilar APK de Jarvis

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Bajar el código
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar
        run: |
          # Si el proyecto está dentro de una subcarpeta JarvisFinanzas, entra ahí
          if [ -f settings.gradle.kts ]; then cd .; elif [ -f JarvisFinanzas/settings.gradle.kts ]; then cd JarvisFinanzas; fi
          gradle assembleDebug --no-daemon --stacktrace
          mkdir -p "$GITHUB_WORKSPACE/salida"
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/salida/Jarvis.apk"

      - name: Guardar el APK para descargar
        uses: actions/upload-artifact@v4
        with:
          name: Jarvis-APK
          path: salida/Jarvis.apk
